meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  systemPackages:
    - libqpdf-dev
    - libjpeg-dev
    - zlib1g-dev
run:
  persistenceMount: /data
  command: gunicorn app:app --bind 0.0.0.0:8080 --workers 1 --timeout 120 --log-level debug --capture-output

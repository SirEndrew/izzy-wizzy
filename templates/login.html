<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Izzy Wizzy — Вход</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0d8cc;
    }

    .card {
      background: #16213e;
      border: 1px solid #2d3561;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #c9a84c;
      text-shadow: 0 0 20px rgba(201,168,76,0.3);
    }

    .logo p {
      font-size: 0.85rem;
      color: #8888aa;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #2d3561;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 0.9rem;
      color: #8888aa;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }

    .tab.active {
      color: #c9a84c;
      border-bottom-color: #c9a84c;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #8888aa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      background: #0f1929;
      border: 1px solid #2d3561;
      border-radius: 8px;
      color: #e0d8cc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #c9a84c;
    }

    input::placeholder { color: #444466; }

    .btn {
      width: 100%;
      padding: 12px;
      background: #c9a84c;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #dbbe6a; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #555; color: #888; cursor: not-allowed; }

    .error {
      background: rgba(220, 50, 50, 0.15);
      border: 1px solid rgba(220, 50, 50, 0.4);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #ff8888;
      margin-bottom: 16px;
      display: none;
    }

    .success {
      background: rgba(50, 200, 100, 0.15);
      border: 1px solid rgba(50, 200, 100, 0.4);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #88ffaa;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>⚔ Izzy Wizzy</h1>
      <p>Лист персонажа D&D 5e</p>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Вход</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Регистрация</div>
    </div>

    <div id="error-msg" class="error"></div>
    <div id="success-msg" class="success"></div>

    <!-- Login form -->
    <div id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="btn-login" onclick="doLogin()">Войти</button>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" placeholder="Минимум 6 символов" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Повторите пароль</label>
        <input type="password" id="reg-password2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn" id="btn-register" onclick="doRegister()">Создать аккаунт</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideMessages();
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('success-msg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
    }

    function hideMessages() {
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('success-msg').style.display = 'none';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Загрузка...' : (btnId === 'btn-login' ? 'Войти' : 'Создать аккаунт');
    }

    async function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) { showError('Заполните все поля'); return; }
      setLoading('btn-login', true);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          showSuccess('Вход выполнен! Загрузка...');
          setTimeout(() => window.location.href = '/', 500);
        } else {
          showError(data.error || 'Ошибка входа');
          setLoading('btn-login', false);
        }
      } catch (e) {
        showError('Ошибка соединения');
        setLoading('btn-login', false);
      }
    }

    async function doRegister() {
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const password2 = document.getElementById('reg-password2').value;
      if (!email || !password) { showError('Заполните все поля'); return; }
      if (password !== password2) { showError('Пароли не совпадают'); return; }
      if (password.length < 6) { showError('Пароль минимум 6 символов'); return; }
      setLoading('btn-register', true);
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          showSuccess('Аккаунт создан! Загрузка...');
          setTimeout(() => window.location.href = '/', 500);
        } else {
          showError(data.error || 'Ошибка регистрации');
          setLoading('btn-register', false);
        }
      } catch (e) {
        showError('Ошибка соединения');
        setLoading('btn-register', false);
      }
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const loginVisible = document.getElementById('form-login').style.display !== 'none';
      if (loginVisible) doLogin(); else doRegister();
    });
  </script>
</body>
</html>
